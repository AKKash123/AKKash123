name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: AKKash123
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237AA2F7&color_dots=%2324283b,%23414868,%237AA2F7,%23BB9AF7&color_dot_border=%2324283b
            dist/github-contribution-grid-snake-dark.svg?color_snake=%237AA2F7&color_dots=%2316161e,%2324283b,%237AA2F7,%23BB9AF7&color_dot_border=%2316161e
            dist/github-contribution-grid-snake.gif?color_snake=%237AA2F7&color_dots=%2324283b,%23414868,%237AA2F7,%23BB9AF7

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
