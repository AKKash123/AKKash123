#!/usr/bin/env python3
"""Polish a Git-Invaders SVG without touching its animation.

Usage: python3 enhance_git_invaders.py input.svg output.svg
Only static styling is changed; every @keyframes rule, id and animated group stays as is.
"""
import re, sys

src, dst = sys.argv[1], sys.argv[2]
s = open(src, encoding="utf-8").read()
count = {}

def sub(name, pattern, repl, flags=0):
    global s
    s, n = re.subn(pattern, lambda m: repl, s, flags=flags)
    count[name] = n

# 1. Extra defs: gradients + glow filters
defs = '''<linearGradient id="bgx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101724"/><stop offset="1" stop-color="#0a0e15"/></linearGradient>
<linearGradient id="gnd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39d353" stop-opacity="0"/><stop offset=".12" stop-color="#39d353" stop-opacity=".7"/><stop offset=".88" stop-color="#39d353" stop-opacity=".7"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></linearGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowS" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
'''
sub("defs", r"</defs>", defs + "</defs>", 0)

# 2. Card background: gradient, rounded corners, hairline border
sub("background",
    r'<rect width="774" height="202" fill="#0d1117"/>',
    '<rect width="774" height="202" rx="12" fill="url(#bgx)"/>'
    '<rect x=".5" y=".5" width="773" height="201" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".08"/>')

# 3. Header: title with ship icon, quieter stats, hairline divider
header = ('<g font-family="\'Segoe UI\',Inter,Helvetica,Arial,sans-serif">'
          '<use href="#ship" x="16" y="9" width="12" height="9"/>'
          '<text x="34" y="18" fill="#e6edf3" font-size="12" font-weight="700" letter-spacing=".2">Git Invaders</text>'
          '<text x="758" y="18" text-anchor="end" fill="#8b949e" font-size="11">'
          '<tspan fill="#39d353" font-weight="700">305</tspan> commits</text></g>'
          '<rect x="16" y="26" width="742" height="1" fill="url(#hdr)"/>')
sub("header", r'<text x="387" y="20".*?</text><text x="758" y="20".*?</text>', header, re.S)

# 4. Empty cells: softer color, rounder corners
sub("cells", r'fill="#161b22" rx="1"', 'fill="#1a2130" rx="2.5"')

# 5. Ground line: fading gradient bar
sub("ground",
    r'<line x1="16" y1="174" x2="758" y2="174"[^>]*/>',
    '<rect x="16" y="173.5" width="742" height="1.5" rx=".75" fill="url(#gnd)"/>')

# 6. Ship + bullets glow
sub("ship", r'<g id="shipg">', '<g id="shipg" filter="url(#glow)">')
sub("bullets", r'fill="#ffffff" opacity="0" rx="1"', 'fill="#b9f8c8" opacity="0" rx="1"')
sub("bullet_group", r'<g clip-path="url\(#bulletclip\)">', '<g clip-path="url(#bulletclip)" filter="url(#glowS)">')

# 7. Legend footer
legend = ('<g font-family="\'Segoe UI\',Inter,Helvetica,Arial,sans-serif" font-size="9" fill="#6e7681">'
          '<text x="16" y="193">Less</text>'
          '<rect x="38" y="185" width="9" height="9" rx="2" fill="#1a2130"/>'
          '<rect x="50" y="185" width="9" height="9" rx="2" fill="#0e4429"/>'
          '<rect x="62" y="185" width="9" height="9" rx="2" fill="#006d32"/>'
          '<rect x="74" y="185" width="9" height="9" rx="2" fill="#26a641"/>'
          '<rect x="86" y="185" width="9" height="9" rx="2" fill="#39d353"/>'
          '<text x="100" y="193">More</text>'
          '<text x="758" y="193" text-anchor="end">Each invader is a day with commits</text></g>')
sub("legend", r'<g id="shipg"', legend + '<g id="shipg"', 0)

open(dst, "w", encoding="utf-8").write(s)
print(count)
bad = [k for k, v in count.items() if v == 0]
if bad: print("WARNING: no match for", bad)
