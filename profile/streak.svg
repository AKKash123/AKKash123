<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">GitHub contribution stats</title>
  <desc id="desc">479 total contributions since Jul 3, 2018. Current streak 0 days. Longest streak 12 days, Sep 22 to Oct 3.</desc>
  <defs>
    <clipPath id="card"><rect width="495" height="195" rx="14"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1D2E"/>
      <stop offset="1" stop-color="#12131E"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8DBBFF"/>
      <stop offset="1" stop-color="#5B8DEF"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D2A8FF"/>
      <stop offset="1" stop-color="#9D6BF0"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9D6BF0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9D6BF0" stop-opacity="0"/>
    </radialGradient>
    <mask id="ringGap">
      <rect width="495" height="195" fill="#fff"/>
      <ellipse cx="247.5" cy="33" rx="15" ry="19" fill="#000"/>
    </mask>
    <style>
      text { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .num { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
      .label { font-size: 13px; font-weight: 600; fill: #E6E8F2; }
      .sub { font-size: 11px; font-weight: 400; fill: #8E93AB; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="495" height="195" fill="url(#bg)"/>
    <circle cx="247.5" cy="75" r="85" fill="url(#glow)"/>
    <rect x="0.5" y="0.5" width="494" height="194" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- Dividers -->
    <rect x="165" y="30" width="1" height="135" fill="url(#divider)"/>
    <rect x="330" y="30" width="1" height="135" fill="url(#divider)"/>

    <!-- Total contributions -->
    <g text-anchor="middle">
      <text x="82.5" y="88" class="num" fill="url(#blue)">479</text>
      <text x="82.5" y="116" class="label">Total Contributions</text>
      <text x="82.5" y="136" class="sub">Jul 3, 2018 – Present</text>
    </g>

    <!-- Current streak -->
    <g text-anchor="middle">
      <g mask="url(#ringGap)">
        <circle cx="247.5" cy="75" r="40" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="5"/>
        <circle cx="247.5" cy="75" r="40" fill="none" stroke="url(#violet)" stroke-width="5"
                stroke-linecap="round" stroke-dasharray="64 252" transform="rotate(-90 247.5 75)"/>
      </g>
      <g transform="translate(247.5 20)">
        <path d="M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z" fill="url(#violet)"/>
      </g>
      <text x="247.5" y="85" class="num" fill="url(#violet)">0</text>
      <text x="247.5" y="140" class="label">Current Streak</text>
      <text x="247.5" y="160" class="sub">Nov 9</text>
    </g>

    <!-- Longest streak -->
    <g text-anchor="middle">
      <text x="412.5" y="88" class="num" fill="url(#blue)">12</text>
      <text x="412.5" y="116" class="label">Longest Streak</text>
      <text x="412.5" y="136" class="sub">Sep 22 – Oct 3</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
